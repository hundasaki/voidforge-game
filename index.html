<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Forge - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #00ff88;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            border: 2px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            max-width: 600px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff88;
            animation: glow 2s ease-in-out infinite;
        }
        
        p {
            font-size: 1.2em;
            margin: 15px 0;
            opacity: 0.9;
        }
        
        .status {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border-left: 4px solid #00ff88;
        }
        
        .status-text {
            font-size: 0.9em;
            color: #00ff88;
        }
        
        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px #00ff88;
            }
            50% {
                text-shadow: 0 0 20px #00ff88, 0 0 30px #00ff88;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ VOID FORGE ⚡</h1>
        <p>Welcome to the Void Forge Game</p>
        <p>Your epic adventure awaits...</p>
        
        <div class="status">
            <p class="status-text">🎮 Game Engine Loading...</p>
            <p class="status-text">Status: Ready to Deploy</p>
        </div>
    </div>
</body>
</html>
