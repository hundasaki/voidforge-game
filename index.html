<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Void Forge - Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #00ff88;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        .title {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff88;
            animation: glow 2s ease-in-out infinite;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 5px;
            font-size: 1.1em;
        }

        .hud-item {
            text-shadow: 0 0 5px #00ff88;
        }

        #gameCanvas {
            border: 3px solid #00ff88;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            border-radius: 5px;
            max-width: 90vw;
            max-height: 70vh;
        }

        .instructions {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9em;
            color: #c9ffd9;
            max-width: 800px;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px #00ff88;
            }
            50% {
                text-shadow: 0 0 20px #00ff88, 0 0 30px #00ff88;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .title {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <h1 class="title">⚡ VOID FORGE ⚡</h1>
    
    <div class="hud">
        <div class="hud-item">❤️ Health: <span id="health">100</span></div>
        <div class="hud-item">⚔️ Score: <span id="score">0</span></div>
        <div class="hud-item">👾 Enemies: <span id="enemies">0</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="instructions">
        <p>🎮 Arrow Keys or WASD to move | SPACEBAR to shoot | Destroy all enemies!</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game variables
        let gameRunning = true;
        let score = 0;
        let health = 100;

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            width: 30,
            height: 30,
            speed: 5,
            velX: 0,
            velY: 0,
            shoot: false
        };

        // Bullets
        let bullets = [];

        // Enemies
        let enemies = [];
        let enemySpawnTimer = 0;

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                player.shoot = true;
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Spawn enemies
        function spawnEnemy() {
            const x = Math.random() * (canvas.width - 30);
            const y = Math.random() * (canvas.height / 3);
            enemies.push({
                x: x,
                y: y,
                width: 25,
                height: 25,
                speed: 2 + Math.random(),
                health: 1
            });
        }

        // Update player
        function updatePlayer() {
            player.velX = 0;
            player.velY = 0;

            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.velX = -player.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.velX = player.speed;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) player.velY = -player.speed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) player.velY = player.speed;

            player.x += player.velX;
            player.y += player.velY;

            // Boundary checking
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;

            // Shooting
            if (player.shoot) {
                bullets.push({
                    x: player.x + player.width / 2 - 3,
                    y: player.y,
                    width: 6,
                    height: 15,
                    speed: 7
                });
                player.shoot = false;
            }
        }

        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        // Update enemies
        function updateEnemies() {
            enemySpawnTimer++;
            if (enemySpawnTimer > 60 && enemies.length < 10) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                // Check collision with player
                if (checkCollision(player, enemies[i])) {
                    health -= 10;
                    enemies.splice(i, 1);
                    continue;
                }

                // Check collision with bullets
                let hit = false;
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (checkCollision(bullets[j], enemies[i])) {
                        enemies[i].health--;
                        bullets.splice(j, 1);
                        hit = true;
                        break;
                    }
                }

                if (hit && enemies[i].health <= 0) {
                    score += 10;
                    enemies.splice(i, 1);
                }

                // Remove if off-screen
                if (enemies[i] && enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                }
            }
        }

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Draw player
        function drawPlayer() {
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Draw cannon
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(player.x + player.width / 2 - 3, player.y - 10, 6, 10);
        }

        // Draw bullets
        function drawBullets() {
            ctx.fillStyle = '#ffff00';
            for (let bullet of bullets) {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            }
        }

        // Draw enemies
        function drawEnemies() {
            ctx.fillStyle = '#ff0066';
            for (let enemy of enemies) {
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            }
        }

        // Draw stars background (optimized - only draw once on canvas)
        function drawStars() {
            ctx.fillStyle = '#333';
            for (let i = 0; i < 20; i++) {
                const x = (i * 80) % canvas.width;
                const y = (i * 60) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }
        }

        // Update HUD
        function updateHUD() {
            document.getElementById('health').textContent = Math.max(0, health);
            document.getElementById('score').textContent = score;
            document.getElementById('enemies').textContent = enemies.length;
        }

        // Game Over
        function gameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff0066';
            ctx.font = 'bold 48px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
            ctx.font = 'bold 32px monospace';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 60);
            ctx.fillStyle = '#00ff88';
            ctx.font = '20px monospace';
            ctx.fillText('Refresh to play again', canvas.width / 2, canvas.height / 2 + 120);
        }

        // Main game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars();

            if (gameRunning) {
                updatePlayer();
                updateBullets();
                updateEnemies();
                updateHUD();

                if (health <= 0) {
                    gameRunning = false;
                }
            }

            drawBullets();
            drawEnemies();
            drawPlayer();

            if (!gameRunning) {
                gameOver();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
